[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccus"
version = "0.1.0"
description = "Paper-based cybercrime complaint classification"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4,<2", "numpy>=1.26,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
train = ["torch>=2.4,<3", "transformers>=4.46,<5", "datasets>=3,<4", "accelerate>=1,<2", "sentencepiece>=0.2", "spacy>=3.8,<4", "bert-score>=0.3.13", "xgboost>=2,<4"]
app = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
include = ["ccus*"]
